<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Excel Smart Search</title>

  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script src="taskpane.js" defer></script>

  <style>
    * { box-sizing:border-box; }

    body{
      font-family:"Segoe UI",sans-serif;
      background:linear-gradient(135deg,#eef2f7,#f7f9fc);
      padding:20px;
      margin:0;
    }

    .card{
      background:white;
      border-radius:14px;
      padding:18px;
      box-shadow:0 8px 20px rgba(0,0,0,0.08);
    }

    h2{ margin:0 0 12px 0; font-size:16px; }

    .split-box{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .box{ display:flex; flex-direction:column; }

    label{
      margin-bottom:6px;
      font-size:11px;
      font-weight:600;
      color:#444;
    }

    textarea{
      width:100%;
      height:150px;
      padding:8px;
      border-radius:12px;
      border:1px solid #ddd;
      resize:none;
      font-size:11px;
      background:#fafafa;
      font-family:monospace;
    }

    .btns{
      margin-top:14px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    button{
      padding:9px 12px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-size:12px;
    }

    .search-btn{ background:#4a90e2; color:white; }
    .show-btn{ background:#f1f1f1; color:#333; }

    .stats-box{
      margin-top:15px;
      background:#f9fafc;
      border-radius:12px;
      padding:12px;
      border:1px solid #e5e7eb;
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .stat-item{
      display:flex;
      justify-content:space-between;
      font-size:12px;
    }

    .report-btn{
      font-size:10px;
      padding:2px 6px;
      border:none;
      border-radius:5px;
      background:#4a90e2;
      color:white;
      cursor:pointer;
      margin-left:auto;
      display:none;
    }

    /* =========================
       🔥 SUCCESS MESSAGE (RIGHT)
    ========================= */
    #successMsg{
      font-size:11px;
      color:#1a7f37;
      text-align:right;   /* 👈 هنا التعديل */
      display:none;
      margin-top:2px;
    }

    .results-card{
      margin-top:12px;
      background:white;
      border-radius:14px;
      padding:18px;
      box-shadow:0 8px 20px rgba(0,0,0,0.08);
    }

    #resultsTable{
      max-height:400px;
      overflow:auto;
      border:1px solid #eee;
      border-radius:10px;
      background:white;
    }
  </style>
</head>

<body>

  <div class="card">

    <h2>🔎 Excel Smart Search</h2>

    <div class="split-box">

      <div class="box">
        <label>🔢 الرقم</label>
        <textarea id="numberBox"></textarea>
      </div>

      <div class="box">
        <label>👤 الاسم</label>
        <textarea id="nameBox"></textarea>
      </div>

    </div>

    <div class="btns">

      <button class="show-btn" onclick="document.getElementById('fileInput').click()">
        📁 رفع ملف
      </button>

      <input type="file" id="fileInput" accept=".xlsx,.xls" hidden />

      <button class="show-btn" onclick="showAllRows()">👁️ إظهار</button>

      <button class="search-btn" onclick="searchNumber()">🔍 بحث</button>

      <button class="show-btn" onclick="clearBox()">🧹 مسح</button>

    </div>

    <div class="stats-box">

      <div class="stat-item">
        📋 القيم المدخلة:
        <span id="inputCount">0</span>
      </div>

      <div class="stat-item">
        📊 الحالة:
        <span id="liveStatus">جاهز للبحث</span>

        <button id="reportBtn" class="report-btn">
          📄 تقرير
        </button>
      </div>

      <!-- 🔥 الرسالة تحت الحالة -->
      <div id="successMsg">
        كل البيانات صحيحة ✅
      </div>

    </div>

  </div>

  <div class="results-card">
    <h2>📊 نتائج البحث</h2>
    <div id="resultsTable">
      <div style="padding:10px;color:#888;">لا توجد نتائج بعد</div>
    </div>
  </div>

</body>
</html>
