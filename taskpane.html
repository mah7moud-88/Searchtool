<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>بحث رقم الحساب</title>

  <style>
    body {
      font-family: Arial;
      padding: 15px;
      background: #f5f5f5;
    }

    .box {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #0078d4;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #106ebe;
    }

    #result {
      margin-top: 15px;
      padding: 10px;
      background: #eef6ff;
      border-radius: 6px;
      font-size: 18px;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="box">

    <h2>بحث رقم الحساب</h2>

    <input type="text" id="accountNumber" placeholder="اكتب رقم الحساب">

    <button id="searchBtn">بحث</button>

    <div id="result">
      النتيجة تظهر هنا
    </div>

  </div>

  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="taskpane.js"></script>

</body>

</html>
