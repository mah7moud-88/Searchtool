<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Search</title>

  <style>

    *{
      box-sizing:border-box;
    }

    body {

      margin:0;
      padding:18px;

      font-family:Segoe UI, Arial;

      background:linear-gradient(135deg,#f4f7fb,#e9eef8);

    }

    .container {

      background:white;
      border-radius:20px;
      padding:18px;
      box-shadow:0 8px 25px rgba(0,0,0,0.08);

    }

    .title {

      margin:0;
      font-size:18px;
      font-weight:700;
      color:#222;

    }

    textarea {

      width:100%;
      height:120px;

      resize:none;

      border:none;
      outline:none;

      padding:12px;

      font-size:13px;

      border-radius:14px;

      background:#f7f9fc;

      box-shadow:inset 0 0 0 1px #dfe5ef;

      margin-top:12px;

    }

    textarea:focus {

      background:white;
      box-shadow:inset 0 0 0 2px #0078d4;

    }

    .btnGroup {

      display:flex;
      gap:10px;
      margin-top:12px;

    }

    button, .uploadBtn {

      flex:1;

      border:none;
      cursor:pointer;

      padding:14px;

      font-size:14px;
      font-weight:700;

      border-radius:14px;

      transition:0.2s;

      display:flex;
      align-items:center;
      justify-content:center;

      gap:8px;

    }

    button {

      background:linear-gradient(135deg,#0078d4,#005ea6);
      color:white;

    }

    button:hover {

      transform:translateY(-2px);
      box-shadow:0 10px 20px rgba(0,120,212,0.25);

    }

    .uploadBtn {

      background:linear-gradient(135deg,#f3f6fb,#e9eef7);
      color:#333;

      box-shadow:inset 0 0 0 1px #dbe2ee;

      position:relative;

    }

    .uploadBtn:hover {

      background:#e9f1ff;

    }

    .uploadBtn input {

      position:absolute;
      inset:0;
      opacity:0;
      cursor:pointer;

    }

    #result {

      margin-top:12px;

      background:#f7f9fc;

      border-radius:14px;

      padding:12px;

      max-height:280px;
      overflow:auto;

      font-size:13px;
      line-height:1.6;

      white-space:pre-line;

      box-shadow:inset 0 0 0 1px #e3e8f2;

    }

  </style>
</head>

<body>

  <div class="container">

    <h2 class="title">🔍 Search</h2>

    <textarea id="accountNumber" placeholder="اكتب أرقام الحسابات كل رقم في سطر"></textarea>

    <div class="btnGroup">

      <button id="searchBtn">🔎 بحث</button>

      <label class="uploadBtn">
        📁 رفع ملف
        <input type="file" id="excelFile" accept=".xlsx,.xls,.csv">
      </label>

    </div>

    <div id="result">النتائج تظهر هنا</div>

  </div>

  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="taskpane.js"></script>

</body>

</html>
